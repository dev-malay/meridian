databases:
  - name: meridian-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: meridian-redis
    plan: free
    ipAllowList: [] 

  - type: web
    name: meridian-provider
    runtime: docker
    dockerfilePath: ./Dockerfile.mockprovider
    healthCheckPath: /health
    plan: free
    envVars:
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: meridian-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "200"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      # Do NOT set LOG_FILE_PATH in production — logs go to stdout
      # and are collected by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: meridian-redis
          type: keyvalue
          property: connectionString
      - key: PROVIDER_BASE_URL
        sync: false # fill with https://meridian-provider.onrender.com after first deploy
